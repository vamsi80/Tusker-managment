name: Tusker for Windows release

# Releases happen on their own: bump "version" in apps/tusker-desktop/package.json
# and push to main. If there's no release for that version yet, this builds the
# installer, tags the commit app-v<version> and publishes it to this repo's
# GitHub Releases next to the widget's (desktop-v*). Installed apps update
# themselves; Settings links to the newest. Pushes that don't change the version
# do nothing. "Run workflow" on the Actions page does the same check by hand.
#
# VITE_PUSHER_KEY below is the website's public NEXT_PUBLIC_PUSHER_KEY; it turns
# on live updates in the app.
on:
  push:
    branches: [main]
    paths:
      - apps/tusker-desktop/package.json
      - .github/workflows/app-release.yml
  workflow_dispatch:

permissions:
  contents: write

# One release run at a time; a newer push waits rather than racing it.
concurrency:
  group: app-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is this version released yet?
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./apps/tusker-desktop/package.json').version")
          tag="app-v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null | grep -q '^app.yml$'; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already released; nothing to do."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing $tag."
          fi

      # No "version" input: pnpm comes from "packageManager" in the root
      # package.json, and the action fails when both are set.
      - if: steps.version.outputs.release == 'true'
        uses: pnpm/action-setup@v4

      - if: steps.version.outputs.release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The app builds the website's code, which resolves its packages from the
      # workspace installs.
      - if: steps.version.outputs.release == 'true'
        run: pnpm install --frozen-lockfile

      # The app itself is outside the pnpm workspace (see pnpm-workspace.yaml).
      - if: steps.version.outputs.release == 'true'
        run: pnpm install --ignore-workspace --frozen-lockfile
        working-directory: apps/tusker-desktop

      - if: steps.version.outputs.release == 'true'
        run: pnpm exec tsc --noEmit
        working-directory: apps/tusker-desktop

      # Create the release (and its tag, on this commit) before electron-builder
      # uploads: when none exists, its parallel uploads each create one (a race),
      # leaving duplicate releases under one tag. An existing one is reused.
      # --latest=false: the widget's updater only reads /releases/latest, so that
      # mark has to stay on the widget's release.
      - name: Create the GitHub release
        if: steps.version.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "Tusker for Windows $VERSION" \
            --notes "The full Tusker app for Windows. Download Tusker-Setup.exe below, or from Settings → Desktop apps." \
            --latest=false

      - if: steps.version.outputs.release == 'true'
        run: pnpm run dist --publish always
        working-directory: apps/tusker-desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Public client key (the website's NEXT_PUBLIC_PUSHER_KEY), not a secret.
          VITE_PUSHER_KEY: 0203f5f8bc12eb473338
          VITE_PUSHER_CLUSTER: ap2
