name: Tusker for Windows release

# Bump "version" in apps/tusker-desktop/package.json, then push a matching tag:
#   git tag app-v0.2.0 && git push origin app-v0.2.0
# The installer lands on this repo's GitHub Releases next to the widget's
# (desktop-v*). Installed apps update themselves; Settings links to the newest.
#
# Optional repository secret VITE_PUSHER_KEY (the website's public
# NEXT_PUBLIC_PUSHER_KEY) turns on live updates; without it the app refreshes
# on focus instead.
on:
  push:
    tags: ["app-v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # No "version" input: pnpm comes from "packageManager" in the root
      # package.json, and the action fails when both are set.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag matches package version
        shell: bash
        working-directory: apps/tusker-desktop
        run: |
          version=$(node -p "require('./package.json').version")
          [ "app-v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME != app-v$version"; exit 1; }

      # The app imports the website's UI kit and @tusker/core from source, which
      # resolve their packages from the workspace installs.
      - run: pnpm install --frozen-lockfile

      # The app itself is outside the pnpm workspace (see pnpm-workspace.yaml).
      - run: pnpm install --ignore-workspace --frozen-lockfile
        working-directory: apps/tusker-desktop

      - run: pnpm exec tsc --noEmit
        working-directory: apps/tusker-desktop

      # Create the release before electron-builder uploads: when none exists, its
      # parallel uploads each create one (a race), leaving duplicate releases under
      # one tag, which GitHub then refuses to edit. An existing one is reused.
      # --latest=false: the widget's updater only reads /releases/latest, so that
      # mark has to stay on the widget's release.
      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Tusker for Windows ${GITHUB_REF_NAME#app-v}" \
            --notes "The full Tusker app for Windows. Download Tusker-Setup.exe below, or from Settings → Desktop apps." \
            --latest=false

      - run: pnpm run dist --publish always
        working-directory: apps/tusker-desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_PUSHER_KEY: ${{ secrets.VITE_PUSHER_KEY }}
          VITE_PUSHER_CLUSTER: ap2
