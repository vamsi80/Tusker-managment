<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:">
<title>Tusker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap">
<style>
  /* Tokens copied from apps/web/src/app/globals.css (the "Trava Web UI" design). */
  :root {
    --background: #faf7f2; --foreground: #111111; --muted: #f4f3f1; --muted-foreground: #8f8f8f;
    --primary: #ffb44b; --primary-foreground: #111111; --border: #e6e6e6; --input: #e4e4e4;
    --broadcast: #e01e2e; --rose: #e11d48; --rose-border: rgb(244 63 94 / 0.6); --rose-bg: rgb(244 63 94 / 0.05);
    --bg-glow: rgb(255 205 130 / 0.32); --bg-warm-panel: rgb(255 220 160 / 0.22);
    --shadow-color: 30 20% 30%;
    --glass-fill: rgb(255 255 255 / 0.3);
    --glass-edge: rgb(0 0 0 / 0.1);
    --glass-shine: rgb(255 255 255 / 0.3);
    --glass-inset: inset 0 8px 10px -8px rgb(0 0 0 / 0.16), inset 0 -10px 14px -8px rgb(255 255 255 / 0.7), 0 1px 0 rgb(255 255 255 / 0.7);
    --glass-rim: linear-gradient(180deg, rgb(255 255 255 / 0.95), rgb(255 255 255 / 0.2) 30%, rgb(255 255 255 / 0.2) 65%, rgb(255 255 255));
    --shadow-lg: 0 0 24px -4px hsl(var(--shadow-color) / 0.14), 0 16px 40px -12px hsl(var(--shadow-color) / 0.16), 0 2px 6px 0 hsl(var(--shadow-color) / 0.05);
    --row: rgb(244 243 241 / 0.6);

    --s-todo-bg: #f1f5f9; --s-todo: #1e293b;
    --s-progress-bg: #fef3c7; --s-progress: #92400e;
    --s-review-bg: #f3e8ff; --s-review: #6b21a8;
    --s-late-bg: #ffe4e6; --s-late: #9f1239;
    --s-ok-bg: #dcfce7; --s-ok: #166534;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: #15130f; --foreground: #f2efe9; --muted: #26221d; --muted-foreground: #a39d93;
      --border: #34302a; --input: #3d3830; --broadcast: #ef4444; --rose: #fb7185;
      --bg-glow: rgb(245 150 40 / 0.35); --bg-warm-panel: rgb(230 130 30 / 0.16);
      --shadow-color: 0 0% 0%;
      --glass-fill: rgb(32 29 25 / 0.5);
      --glass-edge: rgb(255 255 255 / 0.06);
      --glass-shine: rgb(255 255 255 / 0.08);
      --glass-inset: inset 0 8px 10px -8px rgb(0 0 0 / 0.5), inset 0 -10px 14px -8px rgb(255 255 255 / 0.12);
      --glass-rim: linear-gradient(180deg, rgb(255 255 255 / 0.35), rgb(255 255 255 / 0.05) 30%, rgb(255 255 255 / 0.05) 65%, rgb(255 255 255 / 0.4));
      --shadow-lg: 0 6px 16px -8px rgb(0 0 0 / 0.6);
      --row: rgb(38 34 29 / 0.6);

      --s-todo-bg: #1e293b; --s-todo: #e2e8f0;
      --s-progress-bg: rgb(120 53 15 / 0.3); --s-progress: #fcd34d;
      --s-review-bg: rgb(88 28 135 / 0.3); --s-review: #d8b4fe;
      --s-late-bg: rgb(136 19 55 / 0.3); --s-late: #fda4af;
      --s-ok-bg: rgb(20 83 45 / 0.35); --s-ok: #86efac;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    font: 13px/1.45 Inter, "Segoe UI", system-ui, sans-serif; color: var(--foreground);
    /* The web app's warm wash and corner glows (AppBackground), simplified. */
    background:
      radial-gradient(120% 60% at 100% 100%, var(--bg-glow), transparent 60%),
      radial-gradient(90% 50% at 0% 0%, var(--bg-warm-panel), transparent 70%),
      var(--background);
  }
  h1, h2, .big { font-family: Manrope, Inter, "Segoe UI", sans-serif; }

  header { -webkit-app-region: drag; display: flex; align-items: center; gap: 8px; padding: 12px 14px 6px; }
  header img { width: 22px; height: 22px; border-radius: 6px; }
  header h1 { flex: 1; margin: 0; font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header button, header select { -webkit-app-region: no-drag; }

  main { flex: 1; overflow-y: auto; padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 12px; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted-foreground); }

  /* `glass glass-card` from globals.css */
  .card {
    position: relative; border-radius: 24px; padding: 14px 16px;
    border: 1px solid var(--glass-edge);
    background-color: var(--glass-fill);
    background-image: linear-gradient(180deg, transparent 45%, var(--glass-shine));
    box-shadow: var(--glass-inset), var(--shadow-lg);
    backdrop-filter: blur(1px) saturate(1.3);
  }
  .card::before {
    content: ""; position: absolute; inset: 0; padding: 2px; border-radius: inherit; pointer-events: none;
    background: var(--glass-rim);
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  }

  h2 { margin: 0 0 10px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
       display: flex; align-items: center; gap: 8px; }
  h2 svg { width: 16px; height: 16px; flex: none; }
  h2 .spacer { flex: 1; }

  button { font: 600 13px Inter, "Segoe UI", sans-serif; border: 0; border-radius: 999px; padding: 8px 18px; cursor: pointer;
           background: var(--primary); color: var(--primary-foreground); box-shadow: 0 2px 8px -2px hsl(var(--shadow-color) / .25); }
  button:hover { filter: brightness(.96); }
  button:disabled { opacity: .6; cursor: default; }
  button.ghost { background: transparent; box-shadow: none; color: var(--muted-foreground); padding: 4px 8px; font-weight: 500; }
  button.ghost:hover { color: var(--foreground); filter: none; }
  button.icon { width: 28px; height: 28px; padding: 0; display: grid; place-items: center; }
  button.icon svg { width: 15px; height: 15px; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  select, input { font: inherit; color: var(--foreground); background: var(--muted); border: 1px solid var(--input); border-radius: 12px; padding: 9px 12px; width: 100%; }
  header select { width: auto; max-width: 130px; padding: 3px 8px; border-radius: 999px; font-size: 12px; }

  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  /* List rows are pills, as in the web widgets. */
  li { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--row); cursor: pointer; }
  li:hover .name { text-decoration: underline; }
  li .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  li .meta { color: var(--muted-foreground); font-size: 12px; white-space: nowrap; }
  li.unread .name { font-weight: 700; }
  li.unread::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--primary); flex: none; }
  li.late { border-color: var(--rose-border); background: var(--rose-bg); }
  li.late .name { color: var(--rose); }
  li.stack { flex-direction: column; align-items: stretch; gap: 5px; border-radius: 22px; padding: 9px 16px; }
  li .sub { display: flex; align-items: center; gap: 8px; }
  li.empty { justify-content: center; cursor: default; color: var(--muted-foreground); border-style: dashed; background: transparent; }
  li.empty .name { text-align: center; font-weight: 400; }
  li.empty:hover .name { text-decoration: none; }

  .badge { font-size: 10px; font-weight: 600; line-height: 1; padding: 4px 7px; border-radius: 6px; white-space: nowrap; text-transform: uppercase; letter-spacing: .02em;
           background: var(--s-todo-bg); color: var(--s-todo); }
  .status-IN_PROGRESS, .status-HALF_DAY { background: var(--s-progress-bg); color: var(--s-progress); }
  .status-REVIEW { background: var(--s-review-bg); color: var(--s-review); }
  .status-DELAYED, .status-LATE, .status-ABSENT { background: var(--s-late-bg); color: var(--s-late); }
  .status-PRESENT { background: var(--s-ok-bg); color: var(--s-ok); }
  .count { background: var(--broadcast); color: #fff; border-radius: 999px; padding: 2px 7px; font-size: 11px; font-weight: 700; letter-spacing: 0; }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .row > div { min-width: 0; }
  .big { font-size: 20px; font-weight: 800; letter-spacing: -.01em; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; }
  #meeting .big { font-size: 15px; white-space: nowrap; }
  .muted { color: var(--muted-foreground); }
  .error { color: var(--rose); font-size: 12px; margin-top: 8px; }
  .error:empty { display: none; }

  form { display: flex; flex-direction: column; gap: 10px; }
  form button { margin-top: 4px; padding: 10px; }
  #login { justify-content: center; }
  .footer { display: flex; justify-content: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <header>
    <img src="icon.png" alt="">
    <h1>Tusker</h1>
    <select id="workspace" hidden aria-label="Workspace"></select>
    <button class="ghost icon" id="refresh" title="Refresh" aria-label="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
    </button>
    <button class="ghost icon" id="close" title="Hide to tray" aria-label="Hide">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </header>

  <main id="login" hidden>
    <section class="card">
      <form id="loginForm">
        <h2>Sign in to Tusker</h2>
        <input id="email" type="email" placeholder="Email" required autocomplete="username" aria-label="Email">
        <input id="password" type="password" placeholder="Password" required autocomplete="current-password" aria-label="Password">
        <input id="server" type="url" placeholder="Server" required aria-label="Server URL">
        <button type="submit">Sign in</button>
        <div class="error" id="loginError"></div>
      </form>
    </section>
  </main>

  <main id="app" hidden>
    <section class="card">
      <h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        Attendance<span class="spacer"></span><span class="badge" id="attBadge" hidden></span>
      </h2>
      <div class="row">
        <div><div class="big" id="attStatus">…</div><div class="muted" id="attDetail"></div></div>
        <button id="attButton" hidden></button>
      </div>
      <div class="error" id="attError"></div>
    </section>

    <section class="card">
      <h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>
        Next meeting
      </h2>
      <div id="meeting" class="muted">…</div>
    </section>

    <section class="card">
      <h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M9 15l2 2 4-4"/></svg>
        My tasks<span class="spacer"></span><span class="muted" style="text-transform:none;font-weight:500">Today &amp; overdue</span>
      </h2>
      <ul id="tasks"><li class="empty"><span class="name">…</span></li></ul>
    </section>

    <section class="card">
      <h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        Notifications <span class="count" id="unread" hidden></span><span class="spacer"></span>
        <button class="ghost" id="markRead" style="text-transform:none">Mark all read</button>
      </h2>
      <ul id="notifications"><li class="empty"><span class="name">…</span></li></ul>
    </section>

    <div class="footer"><button class="ghost" id="signOut">Sign out</button></div>
  </main>

  <script src="renderer.js"></script>
</body>
</html>
